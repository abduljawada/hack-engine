<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ruffle Memory Inspector panel watchdog harness</title>
  </head>
  <body>
    <h1>Panel watchdog harness</h1>
    <p id="harness-result">Running…</p>

    <select id="instance"></select>
    <select id="type">
      <option value="f64">Float64</option>
      <option value="auto">All numeric</option>
      <option value="i16">Int16</option>
    </select>
    <select id="alignment"><option value="aligned">Aligned</option></select>
    <select id="condition">
      <option value="exact">Exact</option>
      <option value="range">Range</option>
      <option value="unknown">Unknown</option>
      <option value="increasedBy">Increased by</option>
    </select>
    <label id="scan-value-label"><span id="scan-value-text">Value</span><input id="scan-value" value="100" /></label>
    <label id="scan-max-value-label" hidden><input id="scan-max-value" value="200" /></label>
    <label id="multiplier-label"><input id="multiplier" value="1" /></label>
    <button id="first-scan">First scan</button>
    <button id="next-scan">Next scan</button>
    <button id="reset-scan">Reset</button>
    <button id="refresh">Refresh</button>
    <span id="status-dot"></span>
    <span id="status"></span>
    <span id="result-count">0</span>
    <table><tbody id="candidates"></tbody></table>
    <input id="write-address" />
    <input id="write-value" />
    <button id="write">Write</button>
    <button id="add-watch">Add watch</button>
    <button id="freeze">Freeze</button>
    <section class="watch-list">
      <span id="watch-count">0</span>
      <p id="watch-empty"></p>
      <table><tbody id="watches"></tbody></table>
    </section>

    <script src="panel-watchdog-harness-setup.js"></script>
    <script src="../devtools/panel/panel.js"></script>
    <script src="panel-watchdog-harness-run.js"></script>
  </body>
</html>
