<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ruffle Memory Inspector</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main>
      <header>
        <div>
          <h1>Ruffle Memory</h1>
          <p>Embedded WebAssembly memory inspector</p>
        </div>
        <button id="refresh" type="button">Refresh</button>
      </header>

      <section class="controls" aria-label="Scan controls">
        <label class="wide">
          Captured memory
          <select id="instance"></select>
        </label>
        <label>
          Type
          <select id="type">
            <option value="f64">Float64 · AVM1 number</option>
            <option value="auto">All numeric types · discovery</option>
            <option value="i32">Int32 · AVM2 integer</option>
            <option value="u32">Uint32</option>
            <option value="f32">Float32</option>
            <option value="i16">Int16</option>
            <option value="u16">Uint16</option>
            <option value="i8">Int8</option>
            <option value="u8">Uint8</option>
          </select>
        </label>
        <label>
          Alignment
          <select id="alignment">
            <option value="aligned">Natural alignment · faster</option>
            <option value="byte">Any byte · slower</option>
          </select>
        </label>
        <label>
          Condition
          <select id="condition">
            <option value="exact">Exact value</option>
            <option value="range">Value range</option>
            <option value="unknown">Unknown initial value</option>
            <option value="changed">Changed value</option>
            <option value="unchanged">Unchanged value</option>
            <option value="increased">Increased value</option>
            <option value="decreased">Decreased value</option>
            <option value="increasedBy">Increased by</option>
            <option value="decreasedBy">Decreased by</option>
          </select>
        </label>
        <label id="scan-value-label">
          <span id="scan-value-text">Value</span>
          <input id="scan-value" type="number" step="any" value="100" />
        </label>
        <label id="scan-max-value-label" hidden>
          Maximum value
          <input id="scan-max-value" type="number" step="any" value="200" />
        </label>
        <label id="multiplier-label">
          Stored-value multiplier
          <input id="multiplier" type="number" step="any" min="0" value="1" />
        </label>
        <div class="buttons wide">
          <button id="first-scan" class="primary" type="button">First scan</button>
          <button id="next-scan" type="button">Next scan</button>
          <button id="reset-scan" type="button">Reset</button>
        </div>
      </section>

      <section class="status-card" aria-live="polite">
        <span id="status-dot"></span>
        <span id="status">Waiting for an embedded Ruffle WASM instance…</span>
      </section>

      <section class="results">
        <div class="results-heading">
          <h2>Candidates</h2>
          <span id="result-count">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Address</th><th>Type</th><th>Current value</th></tr>
            </thead>
            <tbody id="candidates"></tbody>
          </table>
        </div>
      </section>

      <section class="write-controls" aria-label="Write value">
        <label>
          Address
          <input id="write-address" type="text" placeholder="0x00000000" />
        </label>
        <label>
          New value
          <input id="write-value" type="number" step="any" />
        </label>
        <button id="write" class="danger" type="button">Write value</button>
        <button id="add-watch" type="button">Add watch</button>
        <button id="freeze" type="button">Freeze value</button>
      </section>

      <section class="watch-list" aria-label="Watched addresses">
        <div class="results-heading">
          <div>
            <h2>Watch list</h2>
            <p>Live values and multi-frame write status</p>
          </div>
          <span id="watch-count">0</span>
        </div>
        <p id="watch-empty" class="empty-state">Add a candidate or manual address to watch it across scans.</p>
        <div class="table-wrap watch-table-wrap">
          <table>
            <thead>
              <tr><th>Address</th><th>Type</th><th>Value</th><th>State</th><th></th></tr>
            </thead>
            <tbody id="watches"></tbody>
          </table>
        </div>
      </section>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
