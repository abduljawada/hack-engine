<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hack Engine</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header class="popup-header">
        <div class="header-copy">
          <h1>Hack Engine</h1>
          <div class="header-status" aria-live="polite">
            <span id="status-dot" class="status-dot searching" aria-hidden="true"></span>
            <span id="status-title">Looking for Ruffle memory…</span>
          </div>
        </div>
        <button
          id="pin-popup"
          class="pin-action"
          type="button"
          aria-label="Keep Hack Engine open"
          title="Keep open while using the page"
          disabled
        >
          <img src="../assets/ui-icons/pin.svg" alt="" />
        </button>
      </header>

      <nav id="view-switcher" class="view-switcher" aria-label="Inspector view" hidden>
        <button type="button" data-view="simple" aria-pressed="true">Simple</button>
        <button type="button" data-view="advanced" aria-pressed="false">Advanced</button>
      </nav>

      <section id="quick-tools" class="quick-tools" hidden>
        <div class="quick-heading">
          <div>
            <span class="context-label">Simple view</span>
            <h2>Quick scan</h2>
          </div>
          <span id="automatic-badge" class="automatic-badge">Automatic</span>
        </div>

        <div class="quick-form">
          <label>
            Condition
            <select id="quick-condition">
              <option value="exact">Exact value</option>
              <option value="range">Value range</option>
              <option value="unknown">Unknown initial value</option>
              <option value="changed" data-refine-only>Changed</option>
              <option value="unchanged" data-refine-only>Unchanged</option>
              <option value="increased" data-refine-only>Increased</option>
              <option value="decreased" data-refine-only>Decreased</option>
              <option value="increasedBy" data-refine-only>Increased by</option>
              <option value="decreasedBy" data-refine-only>Decreased by</option>
            </select>
          </label>
          <div class="value-fields">
            <label id="quick-value-label">
              <span id="quick-value-text">Value</span>
              <input id="quick-value" type="number" step="any" value="100" />
            </label>
            <label id="quick-max-label" hidden>
              Maximum
              <input id="quick-max-value" type="number" step="any" value="200" />
            </label>
          </div>
        </div>

        <div class="scan-actions">
          <button id="quick-scan" class="primary-action" type="button">First scan</button>
          <button id="cancel-quick-scan" class="compact-action danger" type="button" hidden>Cancel</button>
          <button id="reset-quick-scan" class="compact-action" type="button" hidden>Reset</button>
        </div>

        <div id="quick-status" class="quick-status" aria-live="polite">Ready to scan this memory.</div>

        <section id="quick-results" class="quick-results" hidden>
          <div class="results-heading">
            <strong>Candidates</strong>
            <span id="quick-result-count">0</span>
          </div>
          <div id="quick-candidates" class="quick-candidates"></div>
          <button id="broaden-search" class="text-action" type="button" hidden>
            Search all number formats
          </button>
        </section>

        <section id="quick-editor" class="quick-editor" hidden>
          <div>
            <span class="context-label">Selected value</span>
            <strong id="selected-address">0x00000000</strong>
          </div>
          <label>
            New value
            <input id="quick-write-value" type="number" step="any" />
          </label>
          <div class="value-presets" aria-label="Numeric limits">
            <button id="quick-set-min" class="preset-action" type="button">Set to min</button>
            <button id="quick-set-max" class="preset-action" type="button">Set to max</button>
          </div>
          <div class="editor-actions">
            <button id="quick-write" class="compact-action danger" type="button">Write value</button>
            <button id="quick-freeze" class="compact-action" type="button">Freeze</button>
          </div>
        </section>
      </section>

      <section id="advanced-tools" class="advanced-tools" hidden>
        <div class="advanced-heading">
          <div>
            <span class="context-label">Advanced view</span>
            <h2>Memory scan</h2>
          </div>
          <span id="advanced-session-badge" class="session-badge">New scan</span>
        </div>

        <div class="advanced-form">
          <label>
            Condition
            <select id="advanced-condition">
              <option value="exact">Exact value</option>
              <option value="range">Value range</option>
              <option value="unknown">Unknown initial value</option>
              <option value="changed" data-refine-only>Changed</option>
              <option value="unchanged" data-refine-only>Unchanged</option>
              <option value="increased" data-refine-only>Increased</option>
              <option value="decreased" data-refine-only>Decreased</option>
              <option value="increasedBy" data-refine-only>Increased by</option>
              <option value="decreasedBy" data-refine-only>Decreased by</option>
            </select>
          </label>
          <div class="value-fields">
            <label id="advanced-value-label">
              <span id="advanced-value-text">Value</span>
              <input id="advanced-value" type="number" step="any" value="100" />
            </label>
            <label id="advanced-max-label" hidden>
              Maximum
              <input id="advanced-max-value" type="number" step="any" value="200" />
            </label>
          </div>
          <div class="advanced-grid">
            <label>
              Number format
              <select id="advanced-type">
                <option value="smart">Automatic</option>
                <option value="auto">All numeric types</option>
                <option value="i8">Int8</option>
                <option value="u8">Uint8</option>
                <option value="i16">Int16</option>
                <option value="u16">Uint16</option>
                <option value="i32">Int32</option>
                <option value="u32">Uint32</option>
                <option value="f32">Float32</option>
                <option value="f64">Float64</option>
              </select>
            </label>
            <label>
              Alignment
              <select id="advanced-alignment">
                <option value="aligned">Aligned</option>
                <option value="byte">Any byte</option>
              </select>
            </label>
          </div>
          <details class="advanced-options">
            <summary>More options</summary>
            <div>
              <label id="advanced-instance-label" hidden>
                Captured memory
                <select id="advanced-instance"></select>
              </label>
              <label>
                Stored-value multiplier
                <input id="advanced-multiplier" type="number" min="0" step="any" value="1" />
              </label>
            </div>
          </details>
        </div>

        <div class="scan-actions">
          <button id="advanced-scan" class="primary-action" type="button">First scan</button>
          <button id="cancel-advanced-scan" class="compact-action danger" type="button" hidden>Cancel</button>
          <button id="reset-advanced-scan" class="compact-action" type="button" hidden>Reset</button>
        </div>
        <div id="advanced-status" class="quick-status" aria-live="polite">Ready to configure a scan.</div>

        <section id="advanced-workspace" class="advanced-workspace" hidden>
          <div class="workspace-tabs" role="tablist" aria-label="Advanced workspace">
            <button type="button" data-workspace="candidates" role="tab" aria-selected="true">
              Candidates <span id="advanced-result-count">0</span>
            </button>
            <button type="button" data-workspace="watches" role="tab" aria-selected="false">
              Watches <span id="advanced-watch-count">0</span>
            </button>
          </div>

          <section id="advanced-candidate-pane" class="workspace-pane">
            <div class="candidate-tools">
              <input id="advanced-filter" type="search" placeholder="Filter address, value, or type" aria-label="Filter candidates" />
              <select id="advanced-sort" aria-label="Sort candidates">
                <option value="address">Address</option>
                <option value="value">Value</option>
                <option value="type">Type</option>
              </select>
            </div>
            <div id="advanced-candidates" class="advanced-candidates"></div>
          </section>

          <section id="advanced-watch-pane" class="workspace-pane" hidden>
            <p id="advanced-watch-empty" class="empty-state">Select a candidate to add it here automatically.</p>
            <div id="advanced-watches" class="advanced-watches"></div>
          </section>
        </section>

        <section id="advanced-editor" class="quick-editor advanced-editor" hidden>
          <div>
            <span class="context-label">Selected value</span>
            <strong id="advanced-selected-address">0x00000000</strong>
          </div>
          <label>
            New value
            <input id="advanced-write-value" type="number" step="any" />
          </label>
          <div class="value-presets" aria-label="Numeric limits">
            <button id="advanced-set-min" class="preset-action" type="button">Set to min</button>
            <button id="advanced-set-max" class="preset-action" type="button">Set to max</button>
          </div>
          <div class="editor-actions">
            <button id="advanced-write" class="compact-action danger" type="button">Write value</button>
            <button id="advanced-freeze" class="compact-action" type="button">Freeze</button>
          </div>
        </section>
      </section>

      <button id="open-inspector" class="inspector-action" type="button" disabled>
        <img class="ui-icon" src="../assets/ui-icons/magnifying-glass.svg" alt="" />
        <span>Open full inspector</span>
        <img class="ui-icon chevron" src="../assets/ui-icons/chevron-right.svg" alt="" />
      </button>

      <div class="secondary-actions">
        <button id="pop-out-window" type="button">
          <img class="ui-icon" src="../assets/ui-icons/pop-out.svg" alt="" />
          <span>Pop out window</span>
          <img class="ui-icon chevron" src="../assets/ui-icons/chevron-right.svg" alt="" />
        </button>
        <button id="refresh-connection" type="button">
          <img class="ui-icon" src="../assets/ui-icons/arrow-path.svg" alt="" />
          <span>Refresh connection</span>
          <img class="ui-icon chevron" src="../assets/ui-icons/chevron-right.svg" alt="" />
        </button>
        <button id="how-it-works" type="button">
          <img class="ui-icon" src="../assets/ui-icons/question-mark-circle.svg" alt="" />
          <span>How it works</span>
          <img class="ui-icon chevron" src="../assets/ui-icons/chevron-right.svg" alt="" />
        </button>
      </div>

      <footer>v0.7</footer>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
